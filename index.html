<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CECM Events</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
      }
      #map {
        flex: 1;
        height: 100%;
      }
      #table-panel {
        width: 480px;
        overflow-y: auto;
        font: 12px sans-serif;
      }
      #events-table {
        width: 100%;
        border-collapse: collapse;
      }
      #events-table th {
        position: sticky;
        top: 0;
        background: #f1f5f9;
        text-align: left;
        padding: 6px;
      }
      #events-table td {
        padding: 6px;
        border-top: 1px solid #f1f5f9;
        vertical-align: top;
        min-width: 100px;
      }

      .filter-component {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1000;
        display: none;
        background: white;
        padding: 6px 8px;
        border-radius: 6px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
      }

      .leaflet-popup-content-wrapper {
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
      }

      .leaflet-popup-content {
        margin: 12px 14px;
      }

      .event-popup {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        min-width: 220px;
        max-width: 280px;
      }

      .popup-header {
        font-size: 14px;
        font-weight: 600;
        color: #64748b;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid #f1f5f9;
      }

      .event-divider {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #f1f5f9;
      }

      .event-title {
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 4px;
        color: #0f172a;
      }

      .event-type {
        margin-bottom: 4px;
      }

      .event-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 6px;
      }

      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
      }

      .badge-primary {
        background: #e0f2fe;
        color: #0369a1;
      }

      .badge-neutral {
        background: #f1f5f9;
        color: #475569;
      }

      .event-loc {
        font-size: 11px;
        font-style: italic;
        color: #64748b;
        margin-bottom: 4px;
      }

      .event-time {
        color: #475569;
        font-size: 12px;
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="table-panel">
      <table id="events-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Event</th>
            <th>Type</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="map"></div>
    <div class="filter-component">
      <select id="type-filter"></select>
      <select id="borough-filter"></select>
      <select id="date-filter"></select>
      <input id="search" type="search" placeholder="Search events or places" />
    </div>
    <script>
      const map = L.map("map", { zoomSnap: 0.25 }).setView([40.73, -73.95], 11);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      function formatTime(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        return Number.isNaN(d.getTime())
          ? ts
          : d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      }

      function formatDate(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        return Number.isNaN(d.getTime())
          ? ""
          : d.toLocaleDateString([], {
              weekday: "short",
              month: "short",
              day: "numeric",
            });
      }

      function shouldShowLocation(eventLocation, locationName) {
        if (!eventLocation || !locationName) return false;

        // Escape special regex characters in locationName (parentheses, brackets, etc.)
        const escaped = locationName.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

        // Strip out every occurrence of locationName
        const stripped = eventLocation.replace(new RegExp(escaped, "gi"), "");

        // Strip common delimiters/noise left behind (colons, dashes, spaces, commas, slashes)
        const remainder = stripped.replace(/[\s:,\/\-–—]+/g, "").trim();

        // If nothing alphanumeric remains, it was purely repetitive
        return remainder.length > 0;
      }

      function renderEventCard(e, isSubsequent, sharedProps, locationName) {
        const dateStr = formatDate(e.start_date_time);
        const timeRange = `${formatTime(e.start_date_time)} – ${formatTime(e.end_date_time)}`;
        const dividerClass = isSubsequent ? "event-divider" : "";

        const extraBadges = [];
        if (e.street_closure_type && e.street_closure_type !== "N/A") {
          extraBadges.push(
            `<span class="badge badge-neutral">${e.street_closure_type}</span>`,
          );
        }
        if (sharedProps.surface_type) {
          extraBadges.push(
            `<span class="badge badge-neutral">${sharedProps.surface_type}</span>`,
          );
        }

        return `
          <div class="${dividerClass}">
          <div class="event-title">${e.event_name || "Event"}</div>

          <div class="event-type">
              <span class="badge badge-primary">${e.event_type || "Event"}</span>
          </div>

          <div class="event-badges">
              ${e.event_borough ? `<span class="badge badge-neutral">${e.event_borough}</span>` : ""}
              ${e.event_agency ? `<span class="badge badge-neutral">${e.event_agency}</span>` : ""}
              ${extraBadges.join(" ")}
          </div>

          <div class="event-time">${dateStr ? `${dateStr} · ` : ""}${timeRange}</div>

          ${shouldShowLocation(e.event_location, locationName) ? `<div class="event-loc">${e.event_location}</div>` : ""}
          </div>
      `;
      }

      const onEachFeature = (feature, layer) => {
        const p = feature.properties || {};
        const events =
          Array.isArray(p.events) && p.events.length > 0 ? p.events : [p];
        const locationName = p.display_name || p.name || "Permitted Area";

        let eventCardsHtml = "";
        for (let i = 0; i < events.length; i++) {
          eventCardsHtml += renderEventCard(events[i], i > 0, p, locationName);
        }

        const popupHtml = `
                <div class="popup-body">
                  <div class="popup-header">
                    <strong>${locationName}</strong> ${events.length > 1 ? `(${events.length} events)` : ""}
                  </div>
                  ${eventCardsHtml}
                </div>
              `;

        layer.bindPopup(popupHtml, { maxHeight: 300 });
      };

      function zoomToLayer() {
        const b = layer.getBounds();
        if (b.isValid()) map.fitBounds(b);
      }

      function renderTable(features) {
        const rows = features
          .flatMap((f) => f.properties.events)
          .sort((a, b) => a.start_date_time.localeCompare(b.start_date_time));
        document.querySelector("#events-table tbody").innerHTML = rows
          .map(
            (e) => `<tr data-key="${e.event_id}|${e.start_date_time}">
        <td>${formatDate(e.start_date_time)}<br>${formatTime(e.start_date_time)}</td>
        <td>${e.event_name || "Event"}</td>
        <td>${e.event_type || ""}</td>
        <td>${e.event_location || ""}</td>
      </tr>`,
          )
          .join("");
      }

      const render = () => {
        if (layer) layer.remove();
        const features = allData.features
          .map((f) => ({
            ...f,
            properties: {
              ...f.properties,
              events: f.properties.events.filter(
                (e) =>
                  (!filters.type || e.event_type === filters.type) &&
                  (!filters.borough || e.event_borough === filters.borough) &&
                  (!filters.date ||
                    e.start_date_time.slice(0, 10) === filters.date) &&
                  (!filters.search ||
                    ((e.event_name || "") + " " + (e.event_location || ""))
                      .toLowerCase()
                      .includes(filters.search)),
              ),
            },
          }))
          .filter((f) => f.properties.events.length > 0);

        renderTable(features);

        layer = L.geoJSON(
          { type: "FeatureCollection", features },
          { onEachFeature },
        ).addTo(map);

        layerByEvent = new Map();
        layer.eachLayer((l) =>
          l.feature.properties.events.forEach((e) =>
            layerByEvent.set(e.event_id + "|" + e.start_date_time, l),
          ),
        );
      };

      let allData, layer;
      const filters = { type: "", borough: "", date: "", search: "" };

      fetch("events-features.geojson")
        .then((res) => res.json())
        .then((data) => {
          data.features.sort(
            (a, b) =>
              (b.properties.areatype === "Whole Park") -
              (a.properties.areatype === "Whole Park"),
          );
          allData = data;

          function setupFilter(id, field, key) {
            const select = document.getElementById(id);
            const values = [
              ...new Set(
                allData.features.flatMap((f) =>
                  f.properties.events.map((e) => e[field]),
                ),
              ),
            ]
              .filter(Boolean)
              .sort();
            select.add(new Option("All", ""));
            values.forEach((v) => select.add(new Option(v, v)));
            select.onchange = () => {
              filters[key] = select.value;
              render();
              if (key === "borough") {
                if (select.value) zoomToLayer();
                else map.setView([40.73, -73.95], 11);
              }
            };
          }

          setupFilter("type-filter", "event_type", "type");
          setupFilter("borough-filter", "event_borough", "borough");

          const dateSelect = document.getElementById("date-filter");
          const days = [
            ...new Set(
              allData.features.flatMap((f) =>
                f.properties.events.map((e) => e.start_date_time.slice(0, 10)),
              ),
            ),
          ].sort();
          dateSelect.add(new Option("All dates", ""));
          days.forEach((d) =>
            dateSelect.add(
              new Option(
                new Date(d + "T00:00").toLocaleDateString([], {
                  weekday: "short",
                  month: "short",
                  day: "numeric",
                }),
                d,
              ),
            ),
          );
          dateSelect.onchange = () => {
            filters.date = dateSelect.value;
            render();
          };

          render();
          document.querySelector(".filter-component").style.display = "block";
        });

      let searchTimer;
      document.getElementById("search").addEventListener("input", (ev) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          filters.search = ev.target.value.trim().toLowerCase();
          render();
        }, 300);
      });

      const tbody = document.querySelector("#events-table tbody");
      tbody.addEventListener("mouseover", (ev) => {
        const row = ev.target.closest("tr");
        const l = row && layerByEvent.get(row.dataset.key);
        if (l) l.setStyle({ color: "#dc2626", weight: 3 });
      });
      tbody.addEventListener("mouseout", (ev) => {
        const row = ev.target.closest("tr");
        const l = row && layerByEvent.get(row.dataset.key);
        if (l) layer.resetStyle(l);
      });
      tbody.addEventListener("click", (ev) => {
        const row = ev.target.closest("tr");
        const l = row && layerByEvent.get(row.dataset.key);
        if (!l) return;
        map.fitBounds(l.getBounds(), { maxZoom: 17 });
        l.openPopup();
      });
    </script>
  </body>
</html>
