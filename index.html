<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CECM Events</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="table-panel">
      <table id="events-table">
        <thead>
          <tr>
            <th>When</th>
            <th>Event</th>
            <th>Type</th>
            <th>Location</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="map"></div>
    <div class="filter-component">
      <select id="type-filter"></select>
      <select id="borough-filter"></select>
      <select id="date-filter"></select>
      <input id="search" type="search" placeholder="Search events or places" />
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
